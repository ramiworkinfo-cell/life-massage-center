name: life_massage
publish_to: 'none'
description: مركز الحياة للمساج - Arabic/English massage and natural therapy booking app.
version: 1.0.0+10
environment:
  sdk: '>=3.4.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  http: ^1.4.0
  crypto: ^3.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/backgrounds/
